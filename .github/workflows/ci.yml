name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Design plan follows its own rules
        run: python tools/plan.py check
      - run: pytest -q
      - name: 1000 seeds generate valid worlds
        run: gen check --seeds 1000
