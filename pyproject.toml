[project]
name = "progen"
version = "0.1.0"
description = "Procedural progression generator for the procedural factory game (milestone 0)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gen = "progen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["progen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
